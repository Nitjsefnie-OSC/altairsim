# CompuPro CP/M 2.2N on the Disk 1, for acceptance-disk1 (tests/acceptance/disk1.cmake).
#
# The built-in `disk1` machine with CPM22N.DSK in drive 0. The test copies this folder out
# of the tree first, so the guest never writes to the tracked image.

[machine]
name = "disk1-cpm22n"
base = "disk1"

[[board]]
id = "fd0"

  [[board.drive]]
  unit  = 0
  mount = "CPM22N.DSK"
