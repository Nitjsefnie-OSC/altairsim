# CompuPro Disk 1 floppy: the controller at C0, its boot EPROM and an Interfacer I console. You supply the disk.
#
#     altairsim disk1
#     MOUNT fd0:drive0 "CPM22N.DSK"
#     RUN 0
#     -> CompuPro Systems 64K CP/M 2.2N
#        A>
#
# THE DISK 1 at the CompuPro standard ports C0-C3. Its boot EPROM answers memory reads at
# 0000-00FF over PHANTOM* until the loader switches it off (OUT C3 with D0 = 0), so the
# machine boots from 0000. The EPROM is a factory dump. Routine 4, the default, is the 8080
# routine for an Interfacer console: it reads sectors 1-4 of track 0 on drive 0 into 0100 by
# DMA and falls into it with C = 0. Routine 6 passes C = 2, and the 2.2N BIOS then uses the
# System Support 1 serial channel as the console (`SET fd0 routine=6`, then
# `CONNECT ss1:serial console`).
#
# PORT 3 D7 is the board's serial line (S1-3, `port3 = serial`). Nothing is connected to it
# here. The 2.2N BIOS writes 80h to port C3 and leaves D7 = 1. D7 = 1 is SPACING, so the
# board logs one "break" line on each boot. The real board holds its line at SPACING in the
# same way.
#
# THE CONSOLE is UART 0 of an Interfacer I at 00-01. The CP/M 2.2N BIOS writes the console to
# port 00. COMPUPRO.LIB on the 2.2N disk puts the Interfacer I UARTs at 00 and 02, with data on
# the even port and status on the odd port (TBE = bit 0, DAV = bit 1, active high). The Interfacer
# II's UART has the same layout. Channel a of the `gsio` board takes its profile, and channel b
# takes the same straps at 02-03.
#
# THE SYSTEM SUPPORT 1 at 50-5F is the clock, timer and interrupt board. ACTIVE.LIB on the 2.2N
# disk sets SYSUP1 (System Support 1 present). Its serial channel is not connected.
#
# THE M-DRIVE/H is not emulated. The 2.2N BIOS finds 0 boards, and its cold-boot MFORM prints
# "DRIVE SPECIFIED IS NOT A MEMORY DRIVE". CP/M runs from the floppy.
#
# THE TERMINAL ignores bit 7. CompuPro's FORMAT.COM sets bit 7 of the last character of each
# message, and the terminals of the time printed the character without it. `strip7out` is the
# console doing what the terminal did.
#
# THE BACKSPACE KEY of a modern terminal sends DEL (7F). `bsdel = "bs"` folds DEL to BS, as the
# other built-in CP/M machines do.

[machine]
name    = "disk1"
startup = ["RUN 0"]

[[board]]
type     = "z80"
id       = "cpu0"
clock_hz = 0

# The Interfacer I: UART 0 (data 00, status 01) is the console, UART 1 (data 02, status 03)
# is not connected.
[[board]]
type = "gsio"
id   = "if1"

  [board.unit.a]
  profile = "compupro-if2"
  connect = "console"

  [board.unit.b]
  data_port     = 02
  status_port   = 03
  dav           = 1
  tbmt          = 0
  inverter_gate = false

[console]
strip7out = true
bsdel     = "bs"

# The System Support 1 at its standard base of 50H.
[[board]]
type = "ss1"
id   = "ss1"
base = 50

# The Disk 1 at its standard base of C0H, with boot routine 4 (the default).
[[board]]
type = "disk1"
id   = "fd0"
port = C0

# 64K of RAM. The boot EPROM shadows 0000-00FF on reads only (honors_phantom = read). The RAM
# under it still takes writes, and its bytes show once the EPROM is off.
[[board]]
type           = "memory"
id             = "mem0"
fill           = "random"
honors_phantom = "read"

  [[board.region]]
  type = "ram"
  at   = 0000
  size = "64K"
